name: Release

# Pull requests are validated by validate.yml. A version tag (for example v0.1.0) is validated
# again here, checked against the version every manifest carries, and published as a GitHub
# release with its CHANGELOG.md entry as the notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install optional validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-diagrams.txt
      - name: Validate repository
        run: ./scripts/validate-repo.sh --skip-compose
      - name: Tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match plugin.json version $version" >&2
            exit 1
          fi
          python3 scripts/sync_manifests.py --check

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "${TAG#v}" <<'PY' > "$RUNNER_TEMP/notes.md"
          import re, sys
          version = re.escape(sys.argv[1])
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{version}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no entry for {sys.argv[1]}")
          print(match.group(1).strip())
          PY
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
