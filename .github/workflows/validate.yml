name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install optional validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-diagrams.txt
      - name: Validate repository
        run: ./scripts/validate-repo.sh --skip-compose
