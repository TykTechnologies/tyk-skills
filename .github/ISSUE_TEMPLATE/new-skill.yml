name: New skill request
description: Suggest a job an agent should be able to do with Tyk that no skill covers yet.
title: "[new skill] "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: What should the agent be able to do, and for whom?
    validations:
      required: true
  - type: textarea
    id: prompts
    attributes:
      label: Prompts that should trigger it
      description: Two or three requests as a user would type them.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Which skill runs, if any, and where it falls short.
  - type: textarea
    id: docs
    attributes:
      label: Public documentation
      description: Pages on https://tyk.io/docs/ that describe the feature.
