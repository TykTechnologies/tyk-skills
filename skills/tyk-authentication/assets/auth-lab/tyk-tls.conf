{
  "listen_port": 8080,
  "template_path": "/opt/tyk-gateway/templates",
  "app_path": "/opt/tyk-gateway/apps",
  "middleware_path": "/opt/tyk-gateway/middleware",
  "use_db_app_configs": false,
  "storage": {
    "type": "redis",
    "host": "redis",
    "port": 6379
  },
  "policies": {
    "policy_source": "file",
    "policy_path": "/opt/tyk-gateway/policies"
  },
  "hash_keys": true,
  "enable_jsvm": true,
  "enable_analytics": false,
  "http_server_options": {
    "enable_strict_routes": true,
    "enable_path_prefix_matching": true,
    "enable_path_suffix_matching": true,
    "use_ssl": true,
    "certificates": [
      {
        "domain_name": "*",
        "cert_file": "/opt/certs/server.crt",
        "key_file": "/opt/certs/server.key"
      }
    ]
  }
}
