apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-oas
  namespace: tyk
data:
  oas.json: |
    {
      "openapi": "3.0.3",
      "info": {"title": "catalogue", "version": "1.0.0"},
      "components": {"securitySchemes": {"apiKey": {"type": "apiKey", "in": "header", "name": "Authorization"}}},
      "security": [{"apiKey": []}],
      "paths": {"/items": {"get": {"operationId": "listItems", "responses": {"200": {"description": "OK"}}}}},
      "x-tyk-api-gateway": {
        "info": {"id": "catalogue", "name": "catalogue", "state": {"active": true}},
        "upstream": {"url": "https://catalogue.internal.example.com"},
        "server": {"listenPath": {"value": "/catalogue/", "strip": true},
          "authentication": {"enabled": true, "securitySchemes": {"apiKey": {"enabled": true}}}}
      }
    }
---
apiVersion: tyk.tyk.io/v1alpha1
kind: TykOasApiDefinition
metadata:
  name: catalogue
  namespace: tyk
spec:
  categories: [payments]
  tykOAS:
    configmapRef:
      name: catalogue-oas
      namespace: tyk
      keyName: oas.json
