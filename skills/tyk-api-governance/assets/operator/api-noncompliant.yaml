apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-catalogue-oas
  namespace: tyk
data:
  oas.json: |
    {
      "openapi": "3.0.3",
      "info": {"title": "legacy-catalogue", "version": "1.0.0"},
      "components": {"securitySchemes": {"apiKey": {"type": "apiKey", "in": "header", "name": "Authorization"}}},
      "security": [{"apiKey": []}],
      "paths": {"/items": {"get": {"responses": {"200": {"description": "OK"}}}}},
      "x-tyk-api-gateway": {
        "info": {"id": "legacy-catalogue", "name": "legacy-catalogue", "state": {"active": true}},
        "upstream": {"url": "https://legacy-catalogue.internal.example.com"},
        "server": {"listenPath": {"value": "/legacy-catalogue/", "strip": true},
          "authentication": {"enabled": true, "securitySchemes": {"apiKey": {"enabled": true}}}}
      }
    }
---
apiVersion: tyk.tyk.io/v1alpha1
kind: TykOasApiDefinition
metadata:
  name: legacy-catalogue
  namespace: tyk
spec:
  categories: [payments]
  tykOAS:
    configmapRef:
      name: legacy-catalogue-oas
      namespace: tyk
      keyName: oas.json
