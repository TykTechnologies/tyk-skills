# Compliant twin: declares an operationId, so the admission preflight passes.
# Applied by operator/verify-governance.sh after the TykRuleset. The spec lives inline in the
# ConfigMap so the demo shows one self-contained manifest per outcome.
apiVersion: v1
kind: ConfigMap
metadata:
  name: __SLUG__-governed-block-good-oas
  namespace: default
  labels:
    demo.tyk.io/owner: platform
    demo.tyk.io/team: api-platform
data:
  api.json: |-
    {
      "openapi": "3.0.3",
      "info": {"title": "__DISPLAY_NAME__ Governed compliant", "version": "1.0.0"},
      "paths": {
        "/orders/{id}": {
          "get": {
            "operationId": "getOrder",
            "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
            "responses": {"200": {"description": "Order"}}
          }
        }
      },
      "x-tyk-api-gateway": {
        "info": {"name": "__DISPLAY_NAME__ Governed compliant", "state": {"active": true}},
        "upstream": {"url": "http://__SLUG__-operator-upstream.default.svc.cluster.local:8080"},
        "server": {"listenPath": {"value": "/demo/__SLUG__/governed-block-good/", "strip": true}}
      }
    }
---
apiVersion: tyk.tyk.io/v1alpha1
kind: TykOasApiDefinition
metadata:
  name: __SLUG__-governed-block-good
  namespace: default
  labels:
    demo.tyk.io/owner: platform
    demo.tyk.io/team: api-platform
spec:
  contextRef:
    name: __SLUG__-team-context
    namespace: default
  categories:
    - __SLUG__-gitops
  tykOAS:
    configmapRef:
      name: __SLUG__-governed-block-good-oas
      namespace: default
      keyName: api.json
