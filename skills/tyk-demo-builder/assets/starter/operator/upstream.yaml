apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SLUG__-operator-upstream
  namespace: default
  labels:
    app.kubernetes.io/name: __SLUG__-operator-upstream
    demo.tyk.io/owner: platform
    demo.tyk.io/team: api-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __SLUG__-operator-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __SLUG__-operator-upstream
        demo.tyk.io/owner: platform
        demo.tyk.io/team: api-platform
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args: ['-listen=:5678', '-text={"status":"ok"}']
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: __SLUG__-operator-upstream
  namespace: default
  labels:
    demo.tyk.io/owner: platform
    demo.tyk.io/team: api-platform
spec:
  selector:
    app.kubernetes.io/name: __SLUG__-operator-upstream
  ports:
    - name: http
      port: 8080
      targetPort: http
